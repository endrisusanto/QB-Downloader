name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows NSIS
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm run build

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Setup Tauri signing key
        shell: bash
        run: |
          mkdir -p src-tauri
          printf "%s\n" "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" > "${{ github.workspace }}/src-tauri/tauri.key"
          cp "${{ github.workspace }}/src-tauri/tauri.key" "${{ github.workspace }}/tauri.key"

      - name: Build Tauri installers
        shell: bash
        run: npm run tauri -- build
        env:
          TAURI_SIGNING_PRIVATE_KEY: "${{ github.workspace }}/src-tauri/tauri.key"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Cleanup signing key
        if: always()
        shell: bash
        run: rm -f "${{ github.workspace }}/src-tauri/tauri.key" "${{ github.workspace }}/tauri.key"

      - name: Generate Auto-Updater manifest (latest.json)
        run: node tools/generate_updater_json.cjs
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload Windows bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: qb-downloader-windows-bundle
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/bundle/latest.json

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "QB Downloader ${{ github.ref_name }}"
          body: "Windows installers (NSIS + MSI), Auto-Updater assets, and Android dashboard app for QB Downloader."
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/bundle/latest.json
            src-tauri/target/release/bundle/**/latest.json

  build-android:
    name: Build Android Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Build Android App (Debug APK)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Rename APK for release
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/qb-dashboard.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qb-dashboard-android-apk
          path: android/app/build/outputs/apk/debug/qb-dashboard.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "QB Downloader ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: android/app/build/outputs/apk/debug/qb-dashboard.apk

